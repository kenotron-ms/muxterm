<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head><body>
<div class="app">
  <div class="title"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span class="name mono">muxterm</span><span class="spacer"></span>
    <div class="ctls"><div class="ibtn hover"><i data-lucide="ellipsis" aria-hidden="true"></i></div>
      <div class="menu right" style="min-width:236px">
        <div class="mi"><span class="mic"><i data-lucide="square-plus" aria-hidden="true"></i></span><span>New session</span><span class="kbd">&#x2303;&#x21E7;N</span></div>
        <div class="mi"><span class="mic"><i data-lucide="globe" aria-hidden="true"></i></span><span>New browser</span></div>
        <div class="mi"><span class="mic" style="color:#bb9af7"><i data-lucide="crosshair" aria-hidden="true"></i></span><span>Open driver</span></div>
        <div class="sep"></div>
        <div class="mi"><span class="mic"><i data-lucide="settings" aria-hidden="true"></i></span><span>Settings</span><span class="kbd">&#x2303;,</span></div>
        <div class="mi"><span class="mic"><i data-lucide="keyboard" aria-hidden="true"></i></span><span>Keyboard Shortcuts</span></div>
        <div class="mi"><span class="mic"><i data-lucide="refresh-cw" aria-hidden="true"></i></span><span>Reconnect</span></div>
        <div class="sep"></div>
        <div class="mi"><span class="mic"><i data-lucide="info" aria-hidden="true"></i></span><span>About muxterm</span></div>
      </div>
    </div>
  </div>
  <div class="body">
    <div class="region">
      <div class="rtabs">
        <div class="schip">work <span class="car"><i data-lucide="chevron-down" aria-hidden="true"></i></span></div>
        <div class="vtab active"><span class="ic go"></span>editor<span class="x"><i data-lucide="x" aria-hidden="true"></i></span></div>
        <div class="vtab"><span class="ic sh"></span>shell<span class="x"><i data-lucide="x" aria-hidden="true"></i></span></div>
        <div class="vtab"><span class="ic log"></span>logs<span class="x"><i data-lucide="x" aria-hidden="true"></i></span></div>
        <div class="spacer"></div>
        <div class="ctls"><div class="ibtn"><i data-lucide="maximize-2" aria-hidden="true"></i></div><div class="ibtn"><i data-lucide="ellipsis" aria-hidden="true"></i></div></div>
      </div>
      <div class="pane-split">
        <div class="pane"><div class="term"><span class="c">  5 </span><span class="k">func</span> <span class="fn">main</span>() {
<span class="c">  6 </span>    fmt.<span class="fn">Println</span>(<span class="s">"hello"</span>)
<span class="c">  7 </span>}<span class="cur"> </span>
</div></div>
        <div class="vdiv"></div>
        <div class="pane"><div class="term">$ go build ./...
$ <span class="cur"> </span>
</div></div>
      </div>
    </div>
  </div>
  <div class="sbar"><span class="live"></span><span class="seg">work</span><span>&middot;</span><span>editor</span><span>&middot;</span><span>%1</span><span class="spacer"></span><span>tokyo-night &middot; <i data-lucide="refresh-cw" aria-hidden="true"></i></span></div>
</div>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body></html>
