<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head><body>
<div class="app">
  <div class="title"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div><span class="name mono">muxterm</span><span class="spacer"></span><div class="ibtn"><i data-lucide="ellipsis" aria-hidden="true"></i></div></div>
  <div class="body">
    <div class="region">
      <div class="rtabs">
        <div class="schip">work <span class="car"><i data-lucide="chevron-down" aria-hidden="true"></i></span></div>
        <div class="vtab active"><span class="ic go"></span>editor<span class="x"><i data-lucide="x" aria-hidden="true"></i></span></div>
        <div class="vtab"><span class="ic sh"></span>shell<span class="x"><i data-lucide="x" aria-hidden="true"></i></span></div>
        <div class="vtab"><span class="ic log"></span>logs<span class="x"><i data-lucide="x" aria-hidden="true"></i></span></div>
        <div class="spacer"></div>
        <div class="ctls"><div class="ibtn"><i data-lucide="maximize-2" aria-hidden="true"></i></div><div class="ibtn hover"><i data-lucide="ellipsis" aria-hidden="true"></i></div>
          <div class="menu right" style="top:32px">
            <div class="mi"><span class="mic"><i data-lucide="layout-split" aria-hidden="true"></i></span><span>Split right</span><span class="kbd">&#x2303;&#x21E7;\</span></div>
            <div class="mi"><span class="mic"><i data-lucide="layout-split" aria-hidden="true"></i></span><span>Split down</span></div>
            <div class="sep"></div>
            <div class="mi"><span class="mic"><i data-lucide="external-link" aria-hidden="true"></i></span><span>Pop out to window</span></div>
            <div class="mi"><span class="mic"><i data-lucide="pencil" aria-hidden="true"></i></span><span>Rename window&hellip;</span></div>
            <div class="sep"></div>
            <div class="mi danger"><span class="mic"><i data-lucide="x" aria-hidden="true"></i></span><span>Close region</span></div>
          </div>
        </div>
      </div>
      <div class="pane-split">
        <div class="pane"><div class="term"><span class="c">  5 </span><span class="k">func</span> <span class="fn">main</span>() {
<span class="c">  6 </span>    fmt.<span class="fn">Println</span>(<span class="s">"hello"</span>)
<span class="c">  7 </span>}<span class="cur"> </span>
</div></div>
        <div class="vdiv"></div>
        <div class="pane"><div class="term">$ go build ./...
$ <span class="cur"> </span>
</div></div>
      </div>
    </div>
    <div class="rdiv"></div>
    <div class="region">
      <div class="rtabs">
        <div class="schip">agents <span class="car"><i data-lucide="chevron-down" aria-hidden="true"></i></span></div>
        <div class="vtab active"><span class="ic log"></span>logs<span class="x"><i data-lucide="x" aria-hidden="true"></i></span></div>
        <div class="spacer"></div>
        <div class="ctls"><div class="ibtn"><i data-lucide="maximize-2" aria-hidden="true"></i></div><div class="ibtn"><i data-lucide="ellipsis" aria-hidden="true"></i></div></div>
      </div>
      <div class="term"><span class="c">12:04:27</span> <span class="ok">INFO</span>  job#88 ok
$ tail -f run.log<span class="cur"> </span>
</div>
    </div>
  </div>
  <div class="sbar"><span class="live"></span><span class="seg">work</span><span>&middot;</span><span>editor</span><span class="spacer"></span><span>tokyo-night &middot; 2 regions &middot; <i data-lucide="refresh-cw" aria-hidden="true"></i></span></div>
</div>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body></html>
