bundle:
  name: muxterm-behavior
  version: 1.0.0
  description: Wires the muxterm MCP server as a tool source, registers the muxterm-expert agent, and stamps the session id into the process title for crash-recovery discovery

hooks:
  # On session:start, stamp "amplifier resume <session-id>" into this
  # process's own title via setproctitle. muxterm's sessiond already reads
  # /proc/<pid>/cmdline for every pane (to capture argv for crash-recovery
  # snapshots); this hook makes that existing read also carry the session
  # id, so a restored pane can resume the exact conversation instead of
  # starting a fresh one. Skipped for sub-agent sessions (parent_id set) so
  # a delegate()/Task-spawned session never clobbers the visible root
  # session's stamp. See modules/hooks-muxterm-session for the full
  # rationale (why setproctitle, not a file or an env var).
  #
  # The same hook also publishes session state to muxterm's home view, and at
  # end of turn asks a cheap model whether the assistant's closing message was
  # actually a question for the human. `prompt:complete` proves a turn ENDED;
  # it cannot tell "here is your answer" from "which option do you want?" --
  # both end a turn identically. Without that read, a session that asked you
  # something silently reports `stopped` and falls off the view.
  #
  # The structural verdict is always published first and the classification
  # only ever amends it, so a slow or unreachable provider costs a late row
  # update, never a stalled session. Every failure path keeps the structural
  # verdict, because a false alarm teaches people to ignore the indicator.
  - module: hooks-muxterm-session
    source: git+https://github.com/kenotron-ms/muxterm@main#subdirectory=modules/hooks-muxterm-session
    # config:
    #   classify_end_of_turn: true   # set false to skip the model call entirely
    #   classify_model: ""           # defaults to the session's own provider

tools:
  - module: tool-mcp
    source: git+https://github.com/microsoft/amplifier-module-tool-mcp@main
    config:
      servers:
        muxterm:
          command: muxterm
          args: ["mcp"]
          # muxterm mcp connects to the running muxterm server via WebSocket.
          # By default it targets localhost:8080. Override with MUXTERM_ADDR env var
          # if your muxterm server is running on a different address.
          #
          # env:
          #   MUXTERM_ADDR: "localhost:8311"

agents:
  include:
    - muxterm:agents/muxterm-expert

context:
  include:
    - muxterm:context/muxterm-awareness.md
