<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the app paints to the edges, and the surfaces that
         sit against one pay for it with env(safe-area-inset-*) (D9).
         interactive-widget=resizes-content: when the on-screen keyboard opens,
         shrink the LAYOUT viewport instead of leaving it full height and
         scrolling the visual one. Without it the home composer -- sticky at
         bottom: 0 -- stays pinned to a viewport bottom that is now behind the
         keyboard, i.e. the one control you are typing into is the one the
         keyboard hides. The alternative is a visualViewport resize listener
         and a manual translate; this is one attribute. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>muxterm</title>
    <meta name="description" content="A terminal multiplexer in your browser." />

    <!-- The server renders the manifest from this server's App icon choice. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#16161e" />
    <meta name="color-scheme" content="dark" />
    <script>
      // The server sends the authoritative app appearance after connection.
      // This local hint paints its previous color mode before the first frame.
      try {
        const light = localStorage.getItem('mux-app-mode') === 'light';
        const root = document.documentElement;
        const scheme = light ? 'light' : 'dark';
        root.style.colorScheme = scheme;
        document.querySelector('meta[name="color-scheme"]').content = scheme;
        root.style.setProperty('--mux-page-bg', light ? '#f4f6f7' : '#1b2025');
        root.style.setProperty('--mux-page-fg', light ? '#26343b' : '#e5ecf0');
        document.querySelector('meta[name="theme-color"]').content =
          light ? '#ffffff' : '#262d33';
      } catch { /* Browser storage may be unavailable. */ }
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />

    <!-- iOS standalone / home-screen support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="muxterm" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <style>
      *, *::before, *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        height: 100%;
        background: var(--mux-page-bg, #1a1b26);
        color: var(--mux-page-fg, #c0caf5);
        font-family: system-ui, -apple-system, sans-serif;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <mux-app></mux-app>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
