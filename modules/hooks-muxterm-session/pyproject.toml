[project]
name = "amplifier-module-hooks-muxterm-session"
version = "0.5.0"
description = "Amplifier hook: stamp the session id into this process's title for muxterm crash recovery, and publish declared session state for muxterm's home view"
requires-python = ">=3.11"
# amplifier-core is a peer dependency provided by the runtime -- do not list it here
dependencies = [
    "setproctitle>=1.3",
]

[project.entry-points."amplifier.modules"]
hooks-muxterm-session = "amplifier_module_hooks_muxterm_session:mount"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_hooks_muxterm_session"]
