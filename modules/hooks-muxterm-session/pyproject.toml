[project]
name = "amplifier-module-hooks-muxterm-session"
version = "0.1.0"
description = "Amplifier hook: write session_id to disk on session:start for muxterm crash recovery"
requires-python = ">=3.11"
# amplifier-core is a peer dependency provided by the runtime — do not list it here
dependencies = []

[project.entry-points."amplifier.modules"]
hooks-muxterm-session = "amplifier_module_hooks_muxterm_session:mount"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_hooks_muxterm_session"]
