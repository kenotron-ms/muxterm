# air config for muxterm dev mode.
# Watches Go source AND web/dist so a Vite rebuild also restarts the server.

root = "."
tmp_dir = "tmp"

[build]
  bin     = "./bin/muxterm"
  # Bind muxterm DEV to LOOPBACK only on port 9091 (prod uses 9090 via systemd).
  # The in-instance Caddy (Caddyfile) listens on the instance IP :8091 and
  # proxies here over 127.0.0.1, so muxterm always sees a loopback peer and
  # its localhost auth-bypass applies (internal/server/auth.go).
  # The SPA has no token logic, so this loopback hop is what lets remote users
  # reach it through the host Caddy without a token.
  args_bin = ["serve", "--addr", "127.0.0.1:9091"]
  cmd     = "go build -o ./bin/muxterm ./cmd/muxterm"
  delay   = 200          # ms to wait after a change before rebuilding
  stop_on_error = false

  # Dirs to watch (Go source + the Vite output dir).
  include_dir = ["cmd", "internal", "web/dist"]
  # "stamp" matches web/dist/build.stamp written by the rebuildSignal Vite
  # plugin after ALL outputs (main bundle, sw.js, workbox-*.js) are flushed.
  # One file → one rebuild, no cascading triggers from per-file Vite writes.
  include_ext = ["go", "stamp"]

  # Never watch inside web/src — Vite owns that; we only care about its output.
  exclude_dir  = ["tmp", "vendor", "testdata", "web/src", "web/node_modules"]
  exclude_regex = ["_test\\.go$"]

[color]
  build   = "yellow"
  runner  = "green"
  watcher = "cyan"
  main    = "magenta"
  app     = ""

[log]
  time = false

[screen]
  clear_on_rebuild = false
  keep_scroll      = true
