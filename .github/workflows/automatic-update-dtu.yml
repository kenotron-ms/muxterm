name: Automatic Update DTU

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service-manager:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Build embedded web assets
        run: |
          npm ci --prefix web
          npm run build --prefix web
      - name: Verify service-manager update path in disposable VM
        run: bash tools/verify-automatic-updates-dtu.sh
