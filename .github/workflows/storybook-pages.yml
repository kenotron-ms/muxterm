name: Storybook Pages

on:
  push:
    branches:
      - main
      # Publish this review branch before merge; main becomes the source after merge.
      - feat/lit-storybook-main
    paths:
      - 'web/**'
      - 'docs/design-system/**'
      - '.github/workflows/storybook-pages.yml'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check:fast
        working-directory: web
      - run: npm run check:ui
        working-directory: web
      - run: npm run build:storybook
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Capture Storybook review screenshots
        run: |
          python3 -m http.server 6006 --directory storybook-static > "$RUNNER_TEMP/storybook-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:6006/index.json > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:6006/index.json > /dev/null
          npm run capture:storybook-review
        working-directory: web
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/storybook-static

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
