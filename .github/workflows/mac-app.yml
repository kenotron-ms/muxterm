name: Mac App

on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/mac-app.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/mac-app.yml'
  workflow_dispatch:
    inputs:
      signed_preview:
        description: Build a Developer ID signed and notarized DMG
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build and sign Mac app
        run: desktop/build-mac.sh

      - name: Verify and archive app
        run: |
          codesign --verify --strict --verbose=2 'desktop/bin/Muxterm.app'
          ditto -c -k --sequesterRsrc --keepParent \
            'desktop/bin/Muxterm.app' \
            'desktop/bin/Muxterm-macos-arm64.zip'

      - name: Verify Mac Quit and background session choice
        run: bash desktop/verify-quit-mac.sh

      - name: Verify native browser control
        run: python3 desktop/verify-browser-control-mac.py

      - uses: actions/upload-artifact@v4
        with:
          name: muxterm-macos-arm64
          path: desktop/bin/Muxterm-macos-arm64.zip
          if-no-files-found: error

  signed-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.signed_preview
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Sign, notarize, and package preview
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_NOTARY_APPLE_ID: ${{ vars.APPLE_NOTARY_APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: bash desktop/release-mac.sh 0.1.0

      - uses: actions/upload-artifact@v4
        with:
          name: muxterm-signed-macos-arm64
          path: |
            desktop/bin/Muxterm-0.1.0-macos-arm64.dmg
            desktop/bin/Muxterm-0.1.0-macos-arm64.zip
            desktop/bin/macos-checksums.txt
          if-no-files-found: error

      - name: Preserve signed 0.1.0 app for isolated updater verification
        run: |
          mkdir -p "$RUNNER_TEMP/muxterm-mac-v1"
          ditto desktop/bin/Muxterm.app "$RUNNER_TEMP/muxterm-mac-v1/Muxterm.app"

      - name: Sign second isolated release
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_NOTARY_APPLE_ID: ${{ vars.APPLE_NOTARY_APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: bash desktop/release-mac.sh 0.2.0

      - name: Verify signed automatic update without an open browser
        run: |
          bash desktop/verify-auto-update-mac.sh \
            "$RUNNER_TEMP/muxterm-mac-v1/Muxterm.app" \
            desktop/bin/Muxterm-0.2.0-macos-arm64.zip \
            desktop/bin/macos-checksums.txt

  automatic-update-dtu:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Build embedded web assets
        run: |
          npm ci --prefix web
          npm run build --prefix web
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev
      - name: Verify service-manager update path in disposable VM
        run: bash tools/verify-automatic-updates-dtu.sh
