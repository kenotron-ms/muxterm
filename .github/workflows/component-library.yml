name: Component library

on:
  pull_request:
    paths:
      - 'web/**'
      - 'docs/design-system/**'
      - '.github/workflows/component-library.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check:fast
        working-directory: web
      - run: npm run check:ui
        working-directory: web
      - run: npm run build:storybook
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Capture Storybook review screenshots
        run: |
          python3 -m http.server 6006 --directory storybook-static > "$RUNNER_TEMP/storybook-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:6006/index.json > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:6006/index.json > /dev/null || { echo "Storybook server did not start"; exit 1; }
          npm run capture:storybook-review
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: muxterm-component-library
          path: web/storybook-static
          retention-days: 30
