name: Linux arm64

on:
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      update_from:
        description: Older published release tag, such as v0.52.151
        required: true
        type: string
      update_to:
        description: Newer published release tag, such as v0.52.152
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify OpenCode 2 and Copilot CLI user installs on native arm64
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          fixture="$RUNNER_TEMP/agent-install-arm64"
          home="$fixture/home"
          mkdir -p "$home"
          trap 'rm -rf "$fixture"' EXIT

          curl -fsSL --retry 3 https://opencode.ai/v2/install -o "$fixture/opencode-install.sh"
          HOME="$home" bash "$fixture/opencode-install.sh" --no-modify-path
          opencode_version="$(HOME="$home" "$home/.opencode/bin/opencode" --version)"
          [[ "$opencode_version" == 'opencode v2.'* ]]
          echo "Native arm64 $opencode_version"

          curl -fsSL --retry 3 https://gh.io/copilot-install -o "$fixture/copilot-install.sh"
          HOME="$home" PREFIX="$home/.local" PATH="$home/.local/bin:$PATH" bash "$fixture/copilot-install.sh"
          copilot_version="$(HOME="$home" "$home/.local/bin/copilot" --version)"
          [[ "$copilot_version" =~ [0-9]+\.[0-9]+\.[0-9]+ ]]
          echo "Native arm64 $copilot_version"

          HOME="$home" PREFIX="$home/.local" PATH="$home/.local/bin:$PATH" bash "$fixture/copilot-install.sh"
          test "$(HOME="$home" "$home/.local/bin/copilot" --version)" = "$copilot_version"
          echo 'Repeat Copilot install and launch succeeded'

      - name: Install PAM development headers
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev

      - name: Build embedded web assets
        run: npm --prefix web ci --prefer-offline && npm --prefix web run build

      - name: Build, run, and inspect native arm64 binary
        run: |
          version=dev
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          mkdir -p arm64-package/internal/amplifierchat/sidecar
          CGO_ENABLED=1 go build -ldflags "-s -w -X main.version=$version" -o arm64-package/muxterm ./cmd/muxterm
          test "$(arm64-package/muxterm version)" = "muxterm $version (MCP: stdio)"
          readelf -h arm64-package/muxterm | grep -E 'Machine:.*AArch64'
          ldd arm64-package/muxterm | grep -F 'libpam.so.0 =>'
          cp README.md LICENSE arm64-package/
          cp internal/amplifierchat/sidecar/main.py internal/amplifierchat/sidecar/loop-live-requirements.txt arm64-package/internal/amplifierchat/sidecar/
          tar -C arm64-package -czf muxterm_linux_arm64.tar.gz muxterm README.md LICENSE internal/amplifierchat/sidecar/main.py internal/amplifierchat/sidecar/loop-live-requirements.txt
          tar -tzf muxterm_linux_arm64.tar.gz
          sha256sum muxterm_linux_arm64.tar.gz

      - name: Exercise installer archive selection and checksum in isolated container
        run: |
          expected_version=dev
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            expected_version="${GITHUB_REF_NAME#v}"
          fi
          fixture="$RUNNER_TEMP/arm64-installer"
          mkdir -p "$fixture/bin" "$fixture/release"
          cp muxterm_linux_arm64.tar.gz "$fixture/release/"
          (cd "$fixture/release" && sha256sum muxterm_linux_arm64.tar.gz > checksums.txt)
          printf '%064d  muxterm_linux_arm64.tar.gz\n' 0 > "$fixture/release/bad-checksums.txt"
          cat > "$fixture/bin/curl" <<'EOF'
          #!/bin/sh
          set -eu
          while [ "$#" -gt 0 ]; do
            case "$1" in
              -o) dest="$2"; shift 2 ;;
              -*) shift ;;
              *) url="$1"; shift ;;
            esac
          done
          case "$url" in
            */muxterm_linux_arm64.tar.gz) src=/fixture/release/muxterm_linux_arm64.tar.gz ;;
            */checksums.txt)
              src=/fixture/release/checksums.txt
              if [ "${MUXTERM_TEST_BAD_CHECKSUM:-}" = 1 ]; then src=/fixture/release/bad-checksums.txt; fi
              ;;
            *) echo "unexpected download: $url" >&2; exit 1 ;;
          esac
          cp "$src" "$dest"
          EOF
          chmod +x "$fixture/bin/curl"
          docker run --rm --platform linux/arm64 \
            -e MUXTERM_EXPECTED_VERSION="$expected_version" \
            -v "$PWD/install.sh:/fixture/install.sh:ro" \
            -v "$fixture/bin:/fixture/bin:ro" \
            -v "$fixture/release:/fixture/release:ro" \
            ubuntu:24.04 bash -euo pipefail -c '
              test "$(uname -m)" = aarch64
              # Stop before service setup; all download, checksum, extraction,
              # and binary installation logic above it is unchanged.
              awk '\''/^# Service setup \/ restart$/{exit} {print}'\'' /fixture/install.sh > /tmp/install-archive-only.sh
              PATH=/fixture/bin:$PATH HOME=/tmp/muxterm-home bash /tmp/install-archive-only.sh --version v0.0.0 --no-modify-path
              test "$(/tmp/muxterm-home/.local/bin/muxterm version)" = "muxterm $MUXTERM_EXPECTED_VERSION (MCP: stdio)"
              if MUXTERM_TEST_BAD_CHECKSUM=1 PATH=/fixture/bin:$PATH HOME=/tmp/muxterm-home bash /tmp/install-archive-only.sh --version v0.0.0 --no-modify-path; then
                echo "installer accepted a bad checksum" >&2
                exit 1
              fi
            '

      - name: Exercise self-update against published arm64 release in isolated container
        if: github.event_name != 'workflow_dispatch'
        run: |
          fixture="$RUNNER_TEMP/arm64-self-update"
          mkdir -p "$fixture"
          CGO_ENABLED=1 go build -ldflags '-s -w -X main.version=0.52.149' -o "$fixture/older-muxterm" ./cmd/muxterm
          curl -fsSL --retry 3 "https://github.com/kenotron-ms/muxterm/releases/download/v0.52.150/muxterm_linux_arm64.tar.gz" -o "$fixture/muxterm_linux_arm64.tar.gz"
          curl -fsSL --retry 3 "https://github.com/kenotron-ms/muxterm/releases/download/v0.52.150/checksums.txt" -o "$fixture/checksums.txt"
          (cd "$fixture" && sha256sum --ignore-missing -c checksums.txt)
          cp scripts/verify-arm64-self-update.py "$fixture/verify.py"
          docker run --rm --platform linux/arm64 \
            -v "$fixture:/fixture:ro" \
            python:3.12-bookworm bash -euo pipefail -c '
              apt-get update -qq
              apt-get install -y -qq libpam0g
              python /fixture/verify.py
            '

      - name: Verify published arm64 release-to-release self-update
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_TAG: ${{ inputs.update_from }}
          TARGET_TAG: ${{ inputs.update_to }}
        run: |
          [[ "$SOURCE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$TARGET_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          fixture="$RUNNER_TEMP/arm64-self-update"
          mkdir -p "$fixture/source" "$fixture/target"
          for entry in "source:$SOURCE_TAG" "target:$TARGET_TAG"; do
            directory="${entry%%:*}"
            tag="${entry#*:}"
            base="https://github.com/kenotron-ms/muxterm/releases/download/$tag"
            curl -fsSL --retry 3 "$base/muxterm_linux_arm64.tar.gz" -o "$fixture/$directory/muxterm_linux_arm64.tar.gz"
            curl -fsSL --retry 3 "$base/checksums.txt" -o "$fixture/$directory/checksums.txt"
            (cd "$fixture/$directory" && sha256sum --ignore-missing -c checksums.txt)
          done
          tar -xOzf "$fixture/source/muxterm_linux_arm64.tar.gz" muxterm > "$fixture/older-muxterm"
          chmod +x "$fixture/older-muxterm"
          cp "$fixture/target/muxterm_linux_arm64.tar.gz" "$fixture/muxterm_linux_arm64.tar.gz"
          cp "$fixture/target/checksums.txt" "$fixture/checksums.txt"
          cp scripts/verify-arm64-self-update.py "$fixture/verify.py"
          docker run --rm --platform linux/arm64 \
            -e MUXTERM_SOURCE_VERSION="${SOURCE_TAG#v}" \
            -e MUXTERM_TARGET_VERSION="${TARGET_TAG#v}" \
            -v "$fixture:/fixture:ro" \
            python:3.12-bookworm bash -euo pipefail -c '
              apt-get update -qq
              apt-get install -y -qq libpam0g
              python /fixture/verify.py
            '

      - uses: actions/upload-artifact@v4
        with:
          name: muxterm-linux-arm64
          path: muxterm_linux_arm64.tar.gz
          if-no-files-found: error
