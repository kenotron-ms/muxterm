# Amplifier-powered automated PR review.
# Posts a structured review comment when a PR is opened.
# Requires: ANTHROPIC_API_KEY set in repo Secrets → Actions.
name: PR Review

on:
  pull_request:
    types: [opened, reopened, synchronize]

# Minimum permissions: read the code, write a comment.
permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    # Only run for contributors (PRs from within the repo, not forks).
    # Keeps secrets safe and avoids noise from external contributors until
    # they're ready to be reviewed.
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required — agent needs the full diff

      - uses: microsoft/amplifier-app-actions@main
        with:
          bundle: git+https://github.com/microsoft/amplifier-app-actions@main#subdirectory=bundles/pr-review.bundle.md
          prompt: |
            A pull request was opened on muxterm, a terminal multiplexer with:
            - Go backend: session daemon (PTY management), WebSocket relay server
            - TypeScript/Lit 3 frontend: custom elements, dockview tab layout, xterm.js terminals
            - Communication: binary WebSocket protocol between browser and Go server

            Get the diff from the MERGE BASE, and never from a two-dot
            comparison against main:

                gh pr diff <number>             # preferred - GitHub computes the base
                git diff origin/main...HEAD     # three dots, if working locally

            `git diff origin/main HEAD` (two dots) renders commits that exist
            only on main as deletions in the branch, so a branch cut before a
            recent merge appears to revert work it never touched. Observed on
            PR #65: three confident "blocking" findings, each prescribing a
            revert of an already-merged commit, in three files that PR did not
            contain.

            Before reporting that this PR removed, reverted, or weakened
            anything, confirm the file is in `gh pr diff <number> --name-only`.
            If it is absent, the finding is an artifact of the base and must be
            dropped. Say nothing about files this PR does not touch.

            Review the diff carefully. Pay particular attention to:
            - WebSocket message protocol correctness (new message types, field naming)
            - Go concurrency safety (mutex coverage, goroutine lifecycle, channel usage)
            - Lit component lifecycle (connectedCallback/disconnectedCallback cleanup, memory leaks)
            - xterm.js terminal state management (registry pruning, scrollback preservation)
            - CSS layout and z-index interactions in the dockview shell
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
