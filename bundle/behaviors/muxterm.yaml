bundle:
  name: muxterm-behavior
  version: 1.0.0
  description: Wires the muxterm MCP server as a tool source and registers the muxterm-expert agent

tools:
  - module: tool-mcp
    source: git+https://github.com/microsoft/amplifier-module-tool-mcp@main
    config:
      servers:
        muxterm:
          command: muxterm
          args: ["mcp"]
          # muxterm mcp connects to the running muxterm server via WebSocket.
          # By default it targets localhost:8080. Override with MUXTERM_ADDR env var
          # if your muxterm server is running on a different address.
          #
          # env:
          #   MUXTERM_ADDR: "localhost:8311"

hooks:
  # On session:start, write the Amplifier session ID to disk so that muxterm's
  # crash-recovery snapshot can resume the exact session with
  # "amplifier resume <id>" instead of dropping the user into a bare shell.
  # The file path written here must match detect.file in muxterm's
  # restore.strategies config (muxterm default: $XDG_DATA_HOME/muxterm/amplifier-session-id).
  - module: hooks-muxterm-session
    source: git+https://github.com/kenotron-ms/muxterm@main#subdirectory=modules/hooks-muxterm-session
    config:
      only_root_sessions: true

agents:
  include:
    - muxterm:agents/muxterm-expert

context:
  include:
    - muxterm:context/muxterm-awareness.md
