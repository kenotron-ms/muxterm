version: 2

before:
  hooks:
    - go mod tidy
    - npm --prefix web ci --prefer-offline
    - npm --prefix web run build

builds:
  - id: muxterm-linux
    main: ./cmd/muxterm
    binary: muxterm
    env:
      # CGO_ENABLED=1 required for msteinert/pam/v2 (PAM Phase 1 auth backend)
      # which is a C binding and cannot build with CGO disabled.
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
    # Linux arm64 excluded: github.com/msteinert/pam/v2 has build constraints
    # that exclude Linux ARM targets during cross-compilation. Phase 4/5 may add
    # platform backends without this constraint.
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
  - id: muxterm-darwin
    main: ./cmd/muxterm
    binary: muxterm
    env:
      # CGO_ENABLED=0: Darwin build doesn't use C bindings (OpenDirectory PAM
      # backend arrives in Phase 4). Pure Go build for maximum portability.
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      # Belt and braces. The binary already carries this file via go:embed
      # (internal/cos/embed.go) and extracts it at runtime, which is what
      # actually makes the chief-of-staff sidecar work on an installed
      # machine -- v0.19.0 shipped without it and the Dashboard failed on
      # first use. Shipping it in the tarball too makes the artifact
      # self-describing and gives a user something to point
      # MUXTERM_COS_SIDECAR at.
      - internal/cos/sidecar/main.py

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "^style:"
      - Merge pull request
      - Merge branch

brews:
  - name: muxterm

    homepage: "https://github.com/kenotron-ms/muxterm"
    description: "Web-first terminal multiplexer with MCP agent integration"
    license: "MIT"
    repository:
      owner: kenotron-ms
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    install: |
      bin.install "muxterm"
    test: |
      system "#{bin}/muxterm", "version"
