version: 2

before:
  hooks:
    - go mod tidy
    - npm --prefix web ci --prefer-offline
    - npm --prefix web run build

builds:
  - id: muxterm
    main: ./cmd/muxterm
    binary: muxterm
    env:
      - CGO_ENABLED=0
    # Windows is excluded: muxterm uses Unix PTYs and Unix domain sockets
    # (sessiond.SocketPath) which are not available on Windows.
    # Linux arm64 is excluded: github.com/msteinert/pam/v2 (PAM bindings for Phase 1 auth)
    # has build constraints that exclude Linux ARM targets during cross-compilation.
    # Phase 4 and 5 may add platform backends that don't have this constraint.
    goos:
      - linux
      - linux
      - darwin
      - darwin
    goarch:
      - amd64
      - arm64
      - amd64
      - arm64
    ignore:
      - goos: linux
        goarch: arm64
    ldflags:
      - -s -w

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "^style:"
      - Merge pull request
      - Merge branch

brews:
  - name: muxterm

    homepage: "https://github.com/kenotron-ms/muxterm"
    description: "Web-first terminal multiplexer with MCP agent integration"
    license: "MIT"
    repository:
      owner: kenotron-ms
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    install: |
      bin.install "muxterm"
    test: |
      system "#{bin}/muxterm", "version"
