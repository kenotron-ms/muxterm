version: 2

before:
  hooks:
    - go mod tidy
    - npm --prefix web ci --prefer-offline
    - npm --prefix web run build

builds:
  - id: muxterm-linux
    main: ./cmd/muxterm
    binary: muxterm
    env:
      # CGO_ENABLED=1 required for msteinert/pam/v2 (PAM Phase 1 auth backend)
      # which is a C binding and cannot build with CGO disabled.
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
    # Linux arm64 is built natively in linux-arm64.yml so CGO links against
    # arm64 PAM. Its archive is added to this release below.
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.releaseBuild=true
  - id: muxterm-darwin
    main: ./cmd/muxterm
    binary: muxterm
    env:
      # CGO_ENABLED=0: Darwin build doesn't use C bindings (OpenDirectory PAM
      # backend arrives in Phase 4). Pure Go build for maximum portability.
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.releaseBuild=true

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      # The Amplifier chat sidecar is embedded in the binary and extracted at
      # runtime. Include its source and requirements in the archive as well so
      # the artifact describes the sidecar shipped with this release.
      - internal/amplifierchat/sidecar/main.py
      - internal/amplifierchat/sidecar/loop-live-requirements.txt

checksum:
  name_template: "checksums.txt"
  extra_files:
    - glob: dist-arm64/muxterm_linux_arm64.tar.gz

release:
  extra_files:
    - glob: dist-arm64/muxterm_linux_arm64.tar.gz

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "^style:"
      - Merge pull request
      - Merge branch

brews:
  - name: muxterm

    homepage: "https://github.com/kenotron-ms/muxterm"
    description: "Web-first terminal multiplexer with MCP agent integration"
    license: "MIT"
    repository:
      owner: kenotron-ms
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    install: |
      bin.install "muxterm"
    test: |
      system "#{bin}/muxterm", "version"
