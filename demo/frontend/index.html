<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>muxterm demo — live status board</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: #1a1b26;
        color: #c0caf5;
        font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace, sans-serif;
        font-size: 14px;
        padding: 1rem;
      }

      h1 {
        color: #7aa2f7;
        margin-bottom: 0.5rem;
        font-size: 1.25rem;
      }

      #status-line {
        color: #565f89;
        margin-bottom: 1rem;
        font-size: 0.85rem;
      }

      #items {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .item {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.5rem 0.75rem;
        border-radius: 4px;
        background: #24283b;
        border-left: 4px solid #565f89;
        animation: fadeIn 0.2s ease-out;
      }

      .item.ok   { border-left-color: #9ece6a; }
      .item.warn { border-left-color: #e0af68; }
      .item.error{ border-left-color: #f7768e; }

      .item .label {
        flex: 1;
        color: #c0caf5;
        font-weight: 600;
      }

      .item .status {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 0.1rem 0.4rem;
        border-radius: 3px;
        background: #1a1b26;
      }

      .item.ok    .status { color: #9ece6a; }
      .item.warn  .status { color: #e0af68; }
      .item.error .status { color: #f7768e; }

      .item .ts {
        color: #565f89;
        font-size: 0.8rem;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <h1>muxterm ken demo — live status board</h1>
    <div id="status-line">Connecting…</div>
    <div id="items"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
